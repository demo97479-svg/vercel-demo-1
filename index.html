<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GenAI Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="chatbox">

            <h1>🤖 GenAI Chatbot</h1>

            <p class="subtitle">Ask anything!</p>

            <form method="POST">

                <textarea
                    name="question"
                    placeholder="Type your question..."
                    required></textarea>

                <button type="submit">
                    Ask AI
                </button>

            </form>

            {% if answer %}

            <div class="response">

                <h3>AI Response</h3>

                <p>{{ answer }}</p>

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
